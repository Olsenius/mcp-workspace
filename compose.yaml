name: mcp-workspace-dev

services:
  gateway:
    build: ./mcp-gateway
    ports: ['127.0.0.1:${DEV_PORT:-18080}:8080']
    environment:
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:18080}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      UPSTREAMS: bibliofil=http://bibliofil:8080,vigilo=http://vigilo:8080,fribo=http://fribo:8080,tibi=http://tibi:8080,spond=http://spond:8080
      UPSTREAM_TOKEN_BIBLIOFIL: ${BIBLIOFIL_TOKEN:?Run task env:init}
      UPSTREAM_TOKEN_VIGILO: ${VIGILO_TOKEN:?Run task env:init}
      UPSTREAM_TOKEN_TIBI: ${TIBI_TOKEN:?Run task env:init}
      UPSTREAM_TOKEN_FRIBO: ${FRIBO_TOKEN:?Run task env:init}
      UPSTREAM_TOKEN_SPOND: ${SPOND_TOKEN:?Run task env:init}
    volumes: [gateway-data:/data]
    depends_on: [bibliofil, vigilo, fribo, tibi, spond]
  bibliofil:
    build: ./bibliofil-mcp
    environment:
      MCP_AUTH_TOKEN: ${BIBLIOFIL_TOKEN:?Run task env:init}
      MCP_READ_ONLY: 'true'
    volumes: [bibliofil-data:/data]
  fribo:
    build: ./fribo-mcp
    environment:
      MCP_AUTH_TOKEN: ${FRIBO_TOKEN:?Run task env:init}
      MCP_READ_ONLY: 'true'
    volumes: [fribo-data:/data]
    read_only: true
    security_opt: [no-new-privileges:true]
  tibi:
    build: ./tibi-mcp
    environment:
      MCP_AUTH_TOKEN: ${TIBI_TOKEN:?Run task env:init}
      MCP_READ_ONLY: 'true'
    volumes: [tibi-data:/data]
    read_only: true
    security_opt: [no-new-privileges:true]
  spond:
    build: ./spond-no-match-mcp
    environment:
      MCP_AUTH_TOKEN: ${SPOND_TOKEN:?Run task env:init}
      MCP_READ_ONLY: 'true'
    volumes: [spond-data:/data]
    read_only: true
    security_opt: [no-new-privileges:true]
  vigilo:
    build: ./vigilo-connector
    environment:
      MCP_AUTH_TOKEN: ${VIGILO_TOKEN:?Run task env:init}
      MCP_ALLOWED_ORIGINS: ${PUBLIC_URL:-http://localhost:18080}
      DATA_DIR: /data
      VIGILO_CONFIG_DIR: /data/vigilo
    volumes: [vigilo-data:/data]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]

volumes:
  gateway-data:
  bibliofil-data:
  fribo-data:
  tibi-data:
  spond-data:
  vigilo-data:
