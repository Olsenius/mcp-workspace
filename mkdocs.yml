site_name: MCP-workspace
site_description: Shared tools and working practices for the MCP servers behind mcp-gateway
repo_url: https://github.com/Olsenius/mcp-workspace
edit_uri: edit/main/docs/
site_dir: .local/site
strict: true

theme:
  name: material
  features:
    - content.code.copy
    - navigation.sections
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: {icon: material/brightness-7, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: {icon: material/brightness-4, name: Light mode}

nav:
  - Overview: index.md
  - Architecture: architecture.md
  - Guide for agents: agents.md

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
