version: '3'

tasks:
  default:
    desc: List workspace commands
    cmds: [task --list]

  status:
    desc: Show branches and local changes across all mani projects
    cmds:
      - mani exec --all --parallel 'git status --short --branch'

  clone:
    desc: Clone missing mani projects
    cmds:
      - mani sync --parallel

  sync:
    desc: >
      Clone any missing mani projects, then fast-forward pull every project
      (including this workspace repo) to pick up new commits. `mani sync`
      alone only clones missing repos and updates .gitignore — it never
      pulls existing ones, so run this instead when you need everyone's
      repos up to date.
    cmds:
      - mani sync --parallel
      - task: sync:check-workspace
      - mani exec --all --parallel 'git pull --ff-only'

  sync:check-workspace:
    internal: true
    cmds:
      - |
        if ! git rev-parse --verify HEAD >/dev/null 2>&1; then
          echo 'Workspace has no commits. Create the initial commit and configure a remote/upstream before task sync.' >&2
          exit 1
        fi
        if ! git rev-parse --verify '@{upstream}' >/dev/null 2>&1; then
          echo 'Workspace has no upstream. Configure a remote and tracking branch before task sync.' >&2
          exit 1
        fi

  setup:
    desc: Install development dependencies for mani projects (requires network)
    cmds:
      - mani exec --tags go --parallel 'go mod download'
      - mani exec --tags python 'python3 -m venv .venv && .venv/bin/python -m pip install -e ".[dev]"'

  check:
    desc: Validate workspace configuration and environment initialization
    cmds:
      - mani check
      - python3 -c 'import pathlib, tomllib; tomllib.loads(pathlib.Path("mise.toml").read_text())'
      - >-
        env -u ADMIN_PASSWORD PUBLIC_URL=http://localhost:18080 DEV_PORT=18080
        BIBLIOFIL_TOKEN=synthetic-bibliofil VIGILO_TOKEN=synthetic-vigilo
        FRIBO_TOKEN=synthetic-fribo TIBI_TOKEN=synthetic-tibi
        docker compose --env-file /dev/null -f compose.yaml config --quiet
      - mani list projects --tags go
      - mani list projects --tags python
      - task: check:env

  check:env:
    internal: true
    silent: true
    cmds:
      - |
        python3 - <<'PYTHON'
        import os
        from pathlib import Path
        import shutil
        import stat
        import subprocess
        import tempfile

        with tempfile.TemporaryDirectory(prefix="mcp-workspace-check-") as directory:
            root = Path(directory)
            shutil.copyfile("Taskfile.yml", root / "Taskfile.yml")
            command = ["task", "--dir", directory, "env:init"]
            subprocess.run(command, check=True)
            target = root / ".env"
            original = target.read_bytes()
            assert stat.S_IMODE(target.stat().st_mode) == 0o600, "Incorrect .env permissions"
            values = dict(line.split("=", 1) for line in original.decode().splitlines()
                          if line and not line.startswith("#"))
            assert values["DEV_PORT"] == "18080"
            assert values["PUBLIC_URL"] == "http://localhost:18080"
            keys = ("BIBLIOFIL_TOKEN", "VIGILO_TOKEN", "FRIBO_TOKEN", "TIBI_TOKEN", "ADMIN_PASSWORD")
            tokens = [values[key] for key in keys]
            assert all(len(token) >= 32 for token in tokens), "Missing or short credential"
            assert len(set(tokens)) == len(keys), "Credentials must be distinct"
            subprocess.run(command, check=True)
            assert target.read_bytes() == original, "Existing .env was overwritten"
            # A credential missing from an older .env is added; the rest is kept.
            older = "".join(line + "\n" for line in original.decode().splitlines()
                            if not line.startswith("TIBI_TOKEN="))
            target.write_text(older)
            subprocess.run(command, check=True)
            updated = target.read_text()
            assert updated.startswith(older), "Existing values were changed"
            added = dict(line.split("=", 1) for line in updated[len(older):].splitlines())
            assert list(added) == ["TIBI_TOKEN"] and len(added["TIBI_TOKEN"]) >= 32, "Missing credential not added"
            assert stat.S_IMODE(target.stat().st_mode) == 0o600, "Incorrect .env permissions"
            # An existing symlink must not cause another file to be overwritten.
            target.unlink()
            sentinel = root / "sentinel"
            sentinel.write_text("preserve me")
            target.symlink_to(sentinel)
            subprocess.run(command, check=True)
            assert sentinel.read_text() == "preserve me"
        print("Environment initialization checks passed.")
        PYTHON

  check:repos:
    desc: Verify that every mani project has a local Git checkout
    cmds:
      - mani exec --all 'git rev-parse --show-toplevel'

  test:
    desc: Run test suites for all mani projects with language tags
    cmds:
      - mani exec --tags go 'go test -race ./...'
      - mani exec --tags python '.venv/bin/python -m pytest -q'

  test:gateway:
    desc: Run gateway Go tests with the race detector
    cmds:
      - mani exec --projects mcp-gateway 'go test -race ./...'

  test:vigilo:
    desc: Run Vigilo tests with synthetic data
    cmds:
      - mani exec --projects vigilo-connector '.venv/bin/python -m pytest -q'

  test:bibliofil:
    desc: Run Bibliofil Go tests with the race detector
    cmds:
      - mani exec --projects bibliofil-mcp 'go test -race ./...'

  test:fribo:
    desc: Run Fribo Go tests with the race detector
    cmds:
      - mani exec --projects fribo-mcp 'go test -race ./...'

  test:tibi:
    desc: Run Tibi Go tests with the race detector
    cmds:
      - mani exec --projects tibi-mcp 'go test -race ./...'

  tibi:call:
    desc: >
      Make one Tibi MCP tool call against the real account, e.g.
      `task tibi:call TOOL=get_epub_link ID=123`, `task tibi:call
      TOOL=get_kindle_email` or `task tibi:call TOOL=set_kindle_email
      EMAIL=name@kindle.com`. Credentials come from
      1Password (TIBI_OP) and are never written to disk; download links are
      masked in the output. Exactly one call per run, no retries.
    silent: true
    vars:
      TIBI_OP: '{{.TIBI_OP | default "op://bibliotek/Tibi"}}'
      READ_ONLY: '{{if or (eq .TOOL "borrow_ebook") (eq .TOOL "send_to_kindle") (eq .TOOL "set_kindle_email")}}false{{else}}true{{end}}'
      ARGS: '{{if eq .TOOL "get_kindle_email"}}{}{{else if eq .TOOL "set_kindle_email"}}{"kindle_email":"{{.EMAIL}}"}{{else}}{"edition_id":"{{.ID}}"}{{end}}'
      BIN: '{{.ROOT_DIR}}/.local/bin/tibi-mcp'
    preconditions:
      - sh: echo "{{.TOOL}}" | grep -Eqx 'get_ebook|get_epub_link|borrow_ebook|send_to_kindle|get_kindle_email|set_kindle_email'
        msg: TOOL must be get_ebook, get_epub_link, borrow_ebook, send_to_kindle, get_kindle_email or set_kindle_email
      - sh: echo "{{.TOOL}}" | grep -Eqx 'get_kindle_email|set_kindle_email' || echo "{{.ID}}" | grep -Eqx '[0-9]{1,12}'
        msg: ID must be an edition ID of digits
      - sh: test "{{.TOOL}}" != set_kindle_email || echo "{{.EMAIL}}" | grep -Eqx '([A-Za-z0-9._+-]+@(kindle\.com|free\.kindle\.com|pbsync\.com))?'
        msg: EMAIL must be empty or an @kindle.com, @free.kindle.com or @pbsync.com address
    cmds:
      - go -C tibi-mcp build -o "{{.BIN}}" .
      - |
        set -euo pipefail
        envfile=$(mktemp)
        trap 'rm -f "$envfile"' EXIT
        printf '%s\n' \
          'TIBI_CARD_NUMBER={{.TIBI_OP}}/username' \
          'TIBI_PIN={{.TIBI_OP}}/password' \
          'MCP_TRANSPORT=stdio' \
          'MCP_READ_ONLY={{.READ_ONLY}}' > "$envfile"
        {
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"tibi-call","version":"0"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"{{.TOOL}}","arguments":{{.ARGS}}}}'
          sleep 20
        } | timeout 40 op run --env-file="$envfile" -- "{{.BIN}}" 2>/dev/null | jq -c '
          select(.id == 2)
          | if .error then {rpc_error: .error.message}
            else .result
              | (.content[0].text | fromjson? // .)
                | if type == "object" then
                    (if .download_url then .download_url |= (try sub("^(?<h>https://[^/]+).*$"; "\(.h)/… (masked)") catch "(masked)") else . end)
                    | (if .description then .description |= .[0:120] + "…" else . end)
                  else . end
            end'

  build:
    desc: Build the local Docker images
    cmds: [docker compose build]

  env:init:
    desc: Create a local .env with random development credentials, or add missing ones without changing existing values
    silent: true
    cmds:
      - |
        python3 - <<'PYTHON'
        """Generate local development credentials without printing them."""
        from pathlib import Path
        import os
        import secrets

        target = Path(".env")
        tokens = {
            "BIBLIOFIL_TOKEN": secrets.token_hex(32),
            "VIGILO_TOKEN": secrets.token_hex(32),
            "FRIBO_TOKEN": secrets.token_hex(32),
            "TIBI_TOKEN": secrets.token_hex(32),
            "ADMIN_PASSWORD": secrets.token_urlsafe(32),
        }
        content = (
            "# Local development only. Do not import production tokens or data.\n"
            "DEV_PORT=18080\n"
            "PUBLIC_URL=http://localhost:18080\n"
            + "".join(f"{key}={value}\n" for key, value in tokens.items())
        )
        try:
            fd = os.open(target, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
        except FileExistsError:
            # Existing values are kept. Credentials added since the file was
            # created are appended, but never through a symlink.
            if target.is_symlink() or not target.is_file():
                print(".env is not a regular file; no changes made.")
                raise SystemExit
            text = target.read_text()
            present = {line.split("=", 1)[0] for line in text.splitlines() if "=" in line}
            missing = [key for key in tokens if key not in present]
            if not missing:
                print(".env already exists; no changes made.")
                raise SystemExit
            fd = os.open(target, os.O_WRONLY | os.O_APPEND | os.O_NOFOLLOW)
            with os.fdopen(fd, "w") as stream:
                if text and not text.endswith("\n"):
                    stream.write("\n")
                stream.write("".join(f"{key}={tokens[key]}\n" for key in missing))
            print(f"Added {', '.join(missing)} to .env. Credentials have not been printed.")
        else:
            with os.fdopen(fd, "w") as stream:
                stream.write(content)
            print("Created .env with mode 600. Credentials have not been printed.")
        PYTHON

  dev:up:
    desc: Build and start an isolated local environment on loopback
    preconditions:
      - sh: test -f .env
        msg: Run task env:init first.
    cmds: [docker compose up -d --build --wait]

  dev:down:
    desc: Stop the local environment and preserve its data volumes
    cmds: [docker compose down]

  dev:status:
    desc: Show local container status
    cmds: [docker compose ps]
